# Hall Monitor — Cross-Platform Desktop Build + GPG Release Signing
# Created (UTC): 2026-03-04T09:58:59Z
# Updated (UTC): 2026-03-10T17:48:00Z
# Owner: FΔFΌ★LΔB / Rob Kennedy
# Triggers on apps/desktop/v* tags to build Linux, macOS, Windows installers.
# All release artifacts are GPG-signed with the PyHall Release Signing key.
# Public key: https://pyhall.dev/gpg.asc  (fingerprint: 3DEF56BB396202E668F7B3B5379C4D5BD7221164)

name: Hall Monitor — Cross-Platform Desktop Build

on:
  push:
    tags:
      - "apps/desktop/v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"

jobs:
  lint:
    name: Skill policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check skill manifests for unsafe policy defaults
        run: python scripts/lint_skill_policy.py

  build:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact: "*.deb,*.AppImage"
          - os: macos-13
            platform: macos
            artifact: "*.dmg"
          - os: windows-2022
            platform: windows
            artifact: "*.msi,*.exe"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux system deps ─────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            gnupg

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      # ── Node (for any JS build step Tauri needs) ──────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Hall Monitor ${{ github.ref_name }}"
          releaseBody: |
            Hall Monitor desktop release — connects to a local Hall server at localhost:8765.

            **Verify release integrity:**
            ```bash
            # Import PyHall signing key (first time only)
            curl -sS https://pyhall.dev/gpg.asc | gpg --import

            # Verify your download
            gpg --verify hall-monitor-<version>-<platform>.sig hall-monitor-<version>-<platform>.<ext>
            ```

            **Key fingerprint:** `3DEF56BB396202E668F7B3B5379C4D5BD7221164`

            **Install the Hall server first:**
            ```
            pip install pyhall-wcp
            pyhall hall start
            ```
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          includeDebug: false
          includeRelease: true

      # ── GPG sign all artifacts (Linux/macOS — gpg available) ──────────────
      - name: Import PyHall GPG signing key
        if: matrix.platform != 'windows'
        shell: bash
        env:
          PYHALL_GPG_PRIVATE_KEY_B64: ${{ secrets.PYHALL_GPG_PRIVATE_KEY_B64 }}
        run: |
          echo "$PYHALL_GPG_PRIVATE_KEY_B64" | base64 -d | gpg --batch --import
          echo "GPG key imported"
          gpg --list-secret-keys releases@pyhall.dev

      - name: Sign release artifacts (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          PYHALL_GPG_FINGERPRINT: ${{ secrets.PYHALL_GPG_FINGERPRINT }}
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          find "$BUNDLE_DIR" \( -name "*.deb" -o -name "*.AppImage" \) | while read -r f; do
            echo "Signing: $f"
            gpg --batch --yes --armor --detach-sign \
              --local-user "$PYHALL_GPG_FINGERPRINT" \
              "$f"
            echo "Signature: ${f}.asc"
          done

      - name: Sign release artifacts (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          PYHALL_GPG_FINGERPRINT: ${{ secrets.PYHALL_GPG_FINGERPRINT }}
        run: |
          BUNDLE_DIR="src-tauri/target/release/bundle"
          find "$BUNDLE_DIR" -name "*.dmg" | while read -r f; do
            echo "Signing: $f"
            gpg --batch --yes --armor --detach-sign \
              --local-user "$PYHALL_GPG_FINGERPRINT" \
              "$f"
            echo "Signature: ${f}.asc"
          done

      # Windows: sign via PowerShell + gpg4win (pre-installed on windows-2022)
      - name: Import PyHall GPG signing key (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PYHALL_GPG_PRIVATE_KEY_B64: ${{ secrets.PYHALL_GPG_PRIVATE_KEY_B64 }}
        run: |
          $keyBytes = [System.Convert]::FromBase64String($env:PYHALL_GPG_PRIVATE_KEY_B64)
          $keyPath = [System.IO.Path]::GetTempFileName() + ".asc"
          [System.IO.File]::WriteAllBytes($keyPath, $keyBytes)
          gpg --batch --import $keyPath
          Remove-Item $keyPath -Force

      - name: Sign release artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PYHALL_GPG_FINGERPRINT: ${{ secrets.PYHALL_GPG_FINGERPRINT }}
        run: |
          $bundleDir = "src-tauri\target\release\bundle"
          Get-ChildItem -Path $bundleDir -Recurse -Include "*.msi","*.exe" | ForEach-Object {
            Write-Host "Signing: $($_.FullName)"
            gpg --batch --yes --armor --detach-sign `
              --local-user $env:PYHALL_GPG_FINGERPRINT `
              $_.FullName
            Write-Host "Signature: $($_.FullName).asc"
          }

      # ── Upload signatures to GitHub release ───────────────────────────────
      - name: Upload GPG signatures to release (Linux)
        if: matrix.platform == 'linux' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb.asc
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage.asc

      - name: Upload GPG signatures to release (macOS)
        if: matrix.platform == 'macos' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/desktop/src-tauri/target/release/bundle/**/*.dmg.asc

      - name: Upload GPG signatures to release (Windows)
        if: matrix.platform == 'windows' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi.asc
            apps/desktop/src-tauri/target/release/bundle/**/*.exe.asc

      # ── Upload all artifacts (workflow_dispatch — no release created) ──────
      - name: Upload build + signature artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hall-monitor-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.deb.asc
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage.asc
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg.asc
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.msi.asc
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.exe.asc
          retention-days: 14
          if-no-files-found: warn

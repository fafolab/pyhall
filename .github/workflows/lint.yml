name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-policy-lint:
    name: Skill policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check skill manifests for unsafe policy defaults
        run: python scripts/lint_skill_policy.py
